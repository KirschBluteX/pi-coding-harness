name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime and release closure
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run compile
      - run: npm run lint
      - run: npm test -- --no-file-parallelism
      - run: npm run build
      - run: npm run verify:sql
      - run: npm run verify:json
      - run: npm run verify:markdown
      - run: npm run verify:state-update
      - run: npm run verify:self-contained
